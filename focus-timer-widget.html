<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<style>
  :root{
    --bg-0:#1C1C1C;
    --bg-1:#262626;
    --bg-2:#2f2f2f;
    --accent:#F97316;
    --accent-dim:#7c3d10;
    --text-0:#F5F5F4;
    --text-1:#A3A3A3;
    --ring-track:#3a3a3a;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-0);
  }
  body{
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:clamp(6px, 3vw, 20px);
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--bg-1);
    border:1px solid #3a3a3a;
    border-radius:var(--radius);
    padding:clamp(12px, 5%, 28px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px, 3vw, 18px);
  }

  /* mode tabs */
  .tabs{
    display:flex;
    gap:6px;
    width:100%;
    background:var(--bg-0);
    border-radius:999px;
    padding:4px;
  }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    color:var(--text-1);
    font-size:clamp(10px, 2.6vw, 13px);
    font-weight:600;
    padding:clamp(6px, 1.8vw, 9px) 4px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab.active{
    background:var(--accent);
    color:#1a1a1a;
  }

  /* ring + time */
  .ring-wrap{
    position:relative;
    width:min(58vw, 220px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .track{ fill:none; stroke:var(--ring-track); stroke-width:7; }
  .progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:7;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear;
  }
  .time-label{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .time{
    font-size:clamp(22px, 8vw, 40px);
    font-weight:700;
    color:var(--text-0);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.5px;
  }
  .session-tag{
    font-size:clamp(9px, 2.2vw, 11px);
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:600;
  }

  /* controls */
  .controls{
    display:flex;
    gap:clamp(8px, 2.5vw, 12px);
    width:100%;
  }
  button.ctrl{
    flex:1;
    border:none;
    border-radius:10px;
    padding:clamp(8px, 2.5vw, 12px);
    font-size:clamp(11px, 2.8vw, 14px);
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;
    font-family:inherit;
  }
  button.ctrl:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--accent); color:#1a1a1a; }
  .btn-primary:hover{ opacity:0.92; }
  .btn-secondary{
    background:var(--bg-0);
    color:var(--text-0);
    border:1px solid #3a3a3a;
  }
  .btn-secondary:hover{ background:var(--bg-2); }

  /* dots */
  .dots{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:clamp(9px, 2.2vw, 11px);
    color:var(--text-1);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--ring-track);
    transition:background .2s ease;
  }
  .dot.filled{ background:var(--accent); }

  .brand{
    font-size:9px;
    color:#565656;
    letter-spacing:.5px;
  }

  /* very narrow columns: stack more tightly */
  @media (max-width:180px){
    .tab{ font-size:9px; padding:5px 2px; }
    .controls{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="tabs" role="tablist">
    <button class="tab active" data-mode="focus" data-min="25">Focus</button>
    <button class="tab" data-mode="short" data-min="5">Short</button>
    <button class="tab" data-mode="long" data-min="15">Long</button>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="progress" id="ring" cx="50" cy="50" r="44"
              stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
    </svg>
    <div class="time-label">
      <div class="time" id="time">25:00</div>
      <div class="session-tag" id="sessionTag">FOCUS</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl btn-primary" id="startBtn">Старт</button>
    <button class="ctrl btn-secondary" id="resetBtn">Скинути</button>
  </div>

  <div class="dots">
    <span id="dotsWrap" style="display:flex; gap:6px;"></span>
    <span id="sessionCount">0 сесій</span>
  </div>

  <div class="brand">Focus Timer</div>
</div>

<script>
  const CIRC = 2 * Math.PI * 44;
  const ring = document.getElementById('ring');
  const timeEl = document.getElementById('time');
  const sessionTagEl = document.getElementById('sessionTag');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const tabs = document.querySelectorAll('.tab');
  const dotsWrap = document.getElementById('dotsWrap');
  const sessionCountEl = document.getElementById('sessionCount');

  ring.style.strokeDasharray = CIRC;

  let mode = 'focus';
  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let timerId = null;
  let completedSessions = parseInt(localStorage.getItem('ft_sessions') || '0', 10);

  const modeLabels = { focus: 'FOCUS', short: 'SHORT BREAK', long: 'LONG BREAK' };

  function renderDots(){
    dotsWrap.innerHTML = '';
    for(let i=0;i<4;i++){
      const d = document.createElement('span');
      d.className = 'dot' + (i < (completedSessions % 4) ? ' filled' : '');
      dotsWrap.appendChild(d);
    }
    sessionCountEl.textContent = completedSessions + (completedSessions === 1 ? ' сесія' : ' сесій');
  }

  function formatTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return m+':'+sec;
  }

  function updateRing(){
    const pct = remaining / totalSeconds;
    ring.style.strokeDashoffset = CIRC * (1-pct);
  }

  function tick(){
    if(remaining > 0){
      remaining--;
      timeEl.textContent = formatTime(remaining);
      updateRing();
    } else {
      clearInterval(timerId);
      running = false;
      startBtn.textContent = 'Старт';
      if(mode === 'focus'){
        completedSessions++;
        localStorage.setItem('ft_sessions', completedSessions);
        renderDots();
      }
    }
  }

  function setMode(newMode, minutes){
    mode = newMode;
    clearInterval(timerId);
    running = false;
    startBtn.textContent = 'Старт';
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    timeEl.textContent = formatTime(remaining);
    sessionTagEl.textContent = modeLabels[mode];
    updateRing();
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === newMode));
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      setMode(tab.dataset.mode, parseInt(tab.dataset.min, 10));
    });
  });

  startBtn.addEventListener('click', () => {
    if(running){
      clearInterval(timerId);
      running = false;
      startBtn.textContent = 'Старт';
    } else {
      running = true;
      startBtn.textContent = 'Пауза';
      timerId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(timerId);
    running = false;
    startBtn.textContent = 'Старт';
    remaining = totalSeconds;
    timeEl.textContent = formatTime(remaining);
    updateRing();
  });

  renderDots();
  updateRing();
</script>

</body>
</html>
