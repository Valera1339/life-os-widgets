<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Music</title>
<style>
  :root{
    --bg-0:#1C1C1C;
    --bg-1:#262626;
    --accent:#F97316;
    --text-1:#A3A3A3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-0);
  }
  body{
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:clamp(6px, 3vw, 16px);
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--bg-1);
    border:1px solid #3a3a3a;
    border-radius:var(--radius);
    overflow:hidden;
  }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .player-wrap iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:0;
  }
  .footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px;
    font-size:10px;
    color:var(--text-1);
  }
  .footer svg{ width:12px; height:12px; color:var(--accent); }
</style>
</head>
<body>

<div class="card">
  <div class="player-wrap">
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLMHH2KuWO0nY&color=white&modestbranding=1&rel=0"
      title="YouTube playlist player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.5-.8-2.2c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8h0s-3.9 0-6.7.2c-.4 0-1.3.1-2.1 1-.6.7-.8 2.2-.8 2.2S2.2 9 2.2 10.7v1.6C2.2 14 2.4 15.8 2.4 15.8s.2 1.5.8 2.2c.8.9 1.9.9 2.4 1 1.7.2 7.4.2 7.4.2s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-1 .6-.7.8-2.2.8-2.2s.2-1.8.2-3.5v-1.6c0-1.7-.2-3.5-.2-3.5zM9.9 14.6V8.9l5.4 2.9-5.4 2.8z"/></svg>
    Focus Music · Valera Gudym
  </div>
</div>

</body>
</html>
