<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Music</title>
<style>
  :root{
    --bg-0:#1C1C1C;
    --bg-1:#262626;
    --bg-2:#2f2f2f;
    --accent:#F97316;
    --text-0:#F5F5F4;
    --text-1:#A3A3A3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-0);
  }
  body{
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:clamp(6px, 3vw, 16px);
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--bg-1);
    border:1px solid #3a3a3a;
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .cover-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    overflow:hidden;
  }
  .cover-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(0.85);
  }
  .yt-badge{
    position:absolute;
    top:8px; right:8px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:3px 7px;
    border-radius:6px;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .yt-badge svg{ width:12px; height:12px; }

  .info{
    padding:clamp(10px,4%,16px) clamp(12px,4%,18px) 4px;
  }
  .title{
    font-size:clamp(13px, 3.6vw, 16px);
    font-weight:700;
    color:var(--text-0);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    font-size:clamp(10px, 2.6vw, 12px);
    color:var(--text-1);
    margin-top:2px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px clamp(12px,4%,18px) 0;
  }
  .progress-track{
    flex:1;
    height:4px;
    background:var(--bg-2);
    border-radius:99px;
    overflow:hidden;
    cursor:pointer;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s linear;
  }
  .time-txt{
    font-size:10px;
    color:var(--text-1);
    font-variant-numeric:tabular-nums;
    min-width:32px;
    text-align:center;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(14px, 5vw, 22px);
    padding:clamp(8px,3vw,14px) 0 clamp(12px,4vw,18px);
  }
  .ctrl-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text-0);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    transition:transform .12s ease, color .15s ease;
  }
  .ctrl-btn:hover{ color:var(--accent); }
  .ctrl-btn:active{ transform:scale(0.9); }
  .ctrl-btn svg{ width:20px; height:20px; }

  .play-btn{
    width:clamp(38px,10vw,46px);
    height:clamp(38px,10vw,46px);
    border-radius:50%;
    background:var(--accent);
    color:#1a1a1a;
  }
  .play-btn:hover{ color:#1a1a1a; opacity:.9; }
  .play-btn svg{ width:20px; height:20px; }

  #playerHolder{
    position:absolute;
    top:-9999px;
    left:-9999px;
    width:200px;
    height:200px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding-bottom:8px;
    font-size:9px;
    color:#565656;
  }
</style>
</head>
<body>

<div class="card">
  <div class="cover-wrap">
    <img id="thumb" src="" alt="cover">
    <div class="yt-badge">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.5-.8-2.2c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8h0s-3.9 0-6.7.2c-.4 0-1.3.1-2.1 1-.6.7-.8 2.2-.8 2.2S2.2 9 2.2 10.7v1.6C2.2 14 2.4 15.8 2.4 15.8s.2 1.5.8 2.2c.8.9 1.9.9 2.4 1 1.7.2 7.4.2 7.4.2s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-1 .6-.7.8-2.2.8-2.2s.2-1.8.2-3.5v-1.6c0-1.7-.2-3.5-.2-3.5zM9.9 14.6V8.9l5.4 2.9-5.4 2.8z"/></svg>
      YouTube
    </div>
  </div>

  <div class="info">
    <div class="title" id="trackTitle">Завантаження...</div>
    <div class="subtitle" id="trackSubtitle">YouTube Music</div>
  </div>

  <div class="progress-row">
    <span class="time-txt" id="curTime">0:00</span>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="time-txt" id="durTime">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" title="Попередній">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Наступний">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </div>

  <div class="brand-row">Powered by YouTube IFrame Player</div>
</div>

<div id="playerHolder"><div id="ytplayer"></div></div>

<script>
  // ==== CONFIGURE YOUR PLAYLIST HERE ====
  const PLAYLIST_ID = "PLMHH2KuWO0nY"; // твій плейлист
  // =======================================

  let player;
  let isPlaying = false;
  let progressTimer;

  const trackTitle = document.getElementById('trackTitle');
  const trackSubtitle = document.getElementById('trackSubtitle');
  const thumb = document.getElementById('thumb');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m+':'+s;
  }

  function updateTrackInfo(){
    try{
      const data = player.getVideoData();
      trackTitle.textContent = data.title || 'Відтворення...';
      trackSubtitle.textContent = data.author || 'YouTube Music';
      const vid = data.video_id;
      if(vid){ thumb.src = 'https://img.youtube.com/vi/'+vid+'/hqdefault.jpg'; }
    }catch(e){}
  }

  function tickProgress(){
    if(!player || typeof player.getCurrentTime !== 'function') return;
    const cur = player.getCurrentTime() || 0;
    const dur = player.getDuration() || 0;
    curTimeEl.textContent = fmt(cur);
    durTimeEl.textContent = fmt(dur);
    progressFill.style.width = dur ? ((cur/dur)*100)+'%' : '0%';
  }

  function onPlayerReady(){
    updateTrackInfo();
    progressTimer = setInterval(tickProgress, 500);
  }

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      playIcon.innerHTML = ICON_PAUSE;
      updateTrackInfo();
    } else if(e.data === YT.PlayerState.PAUSED){
      isPlaying = false;
      playIcon.innerHTML = ICON_PLAY;
    } else if(e.data === YT.PlayerState.CUED){
      updateTrackInfo();
    }
  }

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytplayer', {
      height: '200',
      width: '200',
      playerVars: {
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 0,
        controls: 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  playBtn.addEventListener('click', () => {
    if(!player) return;
    if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(player) player.nextVideo();
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    if(player) player.previousVideo();
  });
  progressTrack.addEventListener('click', (e) => {
    if(!player) return;
    const rect = progressTrack.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const dur = player.getDuration() || 0;
    player.seekTo(dur * pct, true);
  });

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
</script>

</body>
</html>
